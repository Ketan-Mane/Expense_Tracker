services:
  # name: expense-tracker-api
  db:
    image: postgres
    container_name: expense-tracker-db
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=root
      - POSTGRES_DB=expense_tracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
  
  api:
    build: ./backend
    container_name: expense-tracker-api
    depends_on:
      - db
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"

  frontend:
    build: 
      context: ./frontend
      args:
        VITE_SERVER_URL: http://localhost:8000/api
    container_name: expense-tracker-frontend
    depends_on:
      - api
    env_file:
      - ./frontend/.env
    ports:
      - "3000:3000"

volumes:
  pgdata: